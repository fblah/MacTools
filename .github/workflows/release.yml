name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string
      tag_name:
        description: "Existing tag to publish"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest

    # Promote secrets to job-level env so step-level `if:` can test them — the
    # `secrets` context is NOT available in a step `if:`, but `env` is.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            tag="${{ inputs.tag_name }}"
            if [[ -z "$tag" ]]; then
              tag="v$version"
            fi
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$version" > VERSION

      - name: Import Developer ID signing certificate
        # Only runs when the signing secrets are configured; otherwise the build
        # falls back to an ad-hoc signature (not notarizable, fine for testing).
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Write notary API key
        if: ${{ env.NOTARY_KEY_P8 != '' }}
        shell: bash
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"

      - name: Build release artifacts
        shell: bash
        # SPARKLE_PRIVATE_KEY, CODESIGN_IDENTITY, NOTARY_KEY_ID and NOTARY_KEY_ISSUER
        # are inherited from the job-level env above. Only step-specific values are
        # declared here. NOTARY_KEY_PATH points at the .p8 the previous step wrote
        # (empty when the key secret is unset → notarize_app.sh no-ops).
        env:
          VERSION_OVERRIDE: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
          NOTARY_KEY_PATH: ${{ env.NOTARY_KEY_P8 != '' && format('{0}/notary_key.p8', runner.temp) || '' }}
        run: Scripts/make_release_artifacts.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          # A version containing a hyphen (e.g. 0.6.2-rc1) is a prerelease. GitHub's
          # /releases/latest excludes prereleases, so the Sparkle "latest" appcast feed
          # never serves an RC to real users — making release-candidate testing safe.
          prerelease_flag=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$TAG_NAME" \
            "dist/DMonte-Toolbox-$VERSION.zip" \
            "dist/appcast.xml" \
            --title "D'Monte's Toolbox $VERSION" \
            --notes "D'Monte's Toolbox $VERSION release." \
            $prerelease_flag
