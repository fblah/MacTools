name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string
      tag_name:
        description: "Existing tag to publish"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest

    # Promote secrets to job-level env so step-level `if:` can test them — the
    # `secrets` context is NOT available in a step `if:`, but `env` is.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            tag="${{ inputs.tag_name }}"
            if [[ -z "$tag" ]]; then
              tag="v$version"
            fi
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$version" > VERSION

      - name: Import Developer ID signing certificate
        # Only runs when the signing secrets are configured; otherwise the build
        # falls back to an ad-hoc signature (not notarizable, fine for testing).
        if: ${{ env.MACOS_CERT_P12 != '' }}
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock, so the keychain stays usable for the later build step.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # -A grants all apps access to the key (plus -T for codesign explicitly).
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Make our keychain the DEFAULT and put it first on the search list.
          # codesign resolves an identity-by-name against the default keychain, so
          # this is what actually lets the build step find the identity.
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"
          # Fail loudly here (not 60s deep in the build) if the uploaded cert is not a
          # "Developer ID Application" cert — that's the only kind notarization accepts
          # for direct distribution (Apple Distribution / Development certs won't work).
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "::error::MACOS_CERT_P12 does not contain a 'Developer ID Application' certificate." \
                 "Re-export that specific cert from Keychain Access and update the secret." >&2
            exit 1
          fi

      - name: Write notary API key
        if: ${{ env.NOTARY_KEY_P8 != '' }}
        shell: bash
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"

      - name: Build release artifacts
        shell: bash
        # SPARKLE_PRIVATE_KEY, CODESIGN_IDENTITY, NOTARY_KEY_ID and NOTARY_KEY_ISSUER
        # are inherited from the job-level env above. Only step-specific values are
        # declared here. NOTARY_KEY_PATH points at the .p8 the previous step wrote
        # (empty when the key secret is unset → notarize_app.sh no-ops).
        env:
          VERSION_OVERRIDE: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
          NOTARY_KEY_PATH: ${{ env.NOTARY_KEY_P8 != '' && format('{0}/notary_key.p8', runner.temp) || '' }}
        run: |
          # Re-unlock the signing keychain in THIS shell — keychain unlock state does
          # not carry across steps, so codesign would otherwise fail with
          # "no identity found" even though the cert is imported.
          if [[ -n "$CODESIGN_IDENTITY" ]]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
            # Sanity-check the identity is resolvable before the long build.
            security find-identity -v -p codesigning
          fi
          Scripts/make_release_artifacts.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          # A version containing a hyphen (e.g. 0.6.2-rc1) is a prerelease. GitHub's
          # /releases/latest excludes prereleases, so the Sparkle "latest" appcast feed
          # never serves an RC to real users — making release-candidate testing safe.
          prerelease_flag=""
          if [[ "$VERSION" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi
          gh release create "$TAG_NAME" \
            "dist/DMonte-Tool-Box-$VERSION.zip" \
            "dist/appcast.xml" \
            --title "D'Monte's Tool Box $VERSION" \
            --notes "D'Monte's Tool Box $VERSION release." \
            $prerelease_flag
