name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string
      tag_name:
        description: "Existing tag to publish"
        required: false
        type: string
      force_republish:
        description: "Replace the artifacts of an ALREADY-PUBLISHED release. Dangerous: users on this version are offered the new bytes as a Sparkle update."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Serialize every release run repository-wide. Two runs publishing at the same
# time — a re-pushed tag, or a tag push landing while a manual republish is in
# flight — can both create/edit the same GitHub release and interleave their
# asset uploads, leaving a release whose appcast.xml and zip came from different
# builds. Sparkle would then serve that mismatch to users as a broken update.
concurrency:
  # One group for the whole workflow, deliberately not keyed on the tag: a tag
  # push and a workflow_dispatch republish of that same version arrive with
  # different `github.ref`, so a per-tag group would let exactly the two runs
  # that most need serializing race each other.
  #
  # Known cost of the single group: the default queue depth is one, and
  # `cancel-in-progress: false` does not deepen it. Per GitHub's workflow-syntax
  # reference, “any existing pending job or workflow in the same concurrency
  # group will be canceled and the new queued job or workflow will take its
  # place.” So of three tags pushed back-to-back the first runs, the second goes
  # pending, and the third cancels the second. That failure is safe (nothing is
  # published and the tag still exists) and is recovered by re-running this
  # workflow manually with version/tag_name set for the tag that was skipped —
  # the tag exists, so the run rebuilds from it and publishes normally without
  # needing force_republish.
  group: ${{ github.workflow }}
  # NEVER cancel a release that is already running. Between `gh release create`
  # and the asset uploads there is a window where the release exists with no (or
  # only some) artifacts — cancelling lands in exactly that half-published state
  # — and cancelling during notarization abandons a submission Apple is still
  # processing. Waiting costs minutes; a half-published release costs every user
  # on that version a broken update.
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    # Pinned, NOT macos-latest: `latest` migrates to a new image — and a new
    # Xcode/Swift toolchain — on GitHub's schedule, which would silently change
    # the compiler that produces signed, notarized bytes for real users, possibly
    # between a tag being cut and that same tag being republished from identical
    # source.
    #
    # The pin must freeze the toolchain that is ALREADY shipping, not move to a
    # different one. Every release from v0.9.1 through v0.13.0 ran `macos-latest`
    # and landed on the macos-26-arm64 image (checked in the run logs), and the
    # package is developed against that same generation, so macos-26 is a no-op
    # today and purely removes the future migration. Do NOT "play it safe" by
    # pinning to an older image: swift-tools-version 6.1 in Package.swift is a
    # MINIMUM the manifest format requires, not the toolchain the sources are
    # known to compile under, so dropping to macos-15 (Xcode 16.x) would build
    # releases on a compiler and SDK that have never compiled this package —
    # discovered only on a real tag push, with the release blocked.
    #
    # The pin also fixes the runner ARCHITECTURE: the shipped app is single-arch
    # and Scripts/fetch_ffmpeg.sh selects its pinned ffmpeg build from `uname -m`,
    # so the image decides which binary users download. macos-26 is Apple
    # silicon, the same arch macos-latest has been resolving to.
    #
    # Bump this line deliberately, after building and installing a release from
    # the new image.
    runs-on: macos-26
    # Bounded, but generous enough for the real work: a cold release build
    # compiles 20+ targets and then waits on Apple's notary service, which is
    # queue-dependent and can take tens of minutes. The default 6-hour timeout
    # would let one wedged run (a notarytool call that never returns) hold the
    # concurrency slot above for most of a day.
    timeout-minutes: 90

    steps:
      # The `secrets` context is NOT available in a step `if:`, so this step
      # converts "is the secret configured?" into plain step outputs the later
      # `if:` conditions can test. The secrets are env-scoped to THIS step
      # only — promoting them to job-level env would put them in the process
      # environment of EVERY step, including the third-party checkout action
      # and `swift build` (which executes repo-controlled Package.swift
      # manifest code). Each secret's value is instead passed only to the
      # step(s) that actually consume it.
      - name: Detect configured secrets
        id: secrets
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          {
            echo "has_cert=$([[ -n "$MACOS_CERT_P12" ]] && echo true || echo false)"
            echo "has_notary=$([[ -n "$NOTARY_KEY_P8" ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Resolve version
        id: version
        shell: bash
        # Dispatch inputs are passed through env rather than interpolated with
        # ${{ }} into the script text — interpolation would let a crafted input
        # inject shell into this run block.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          # Same semver shape Scripts/bump_version.sh enforces — keep in sync.
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
            tag="$INPUT_TAG_NAME"
            if [[ -z "$tag" ]]; then
              tag="v$version"
            fi
            # The tag must be exactly "v<version>": the zip is named after
            # $version and the appcast download URL is built from $tag, so a
            # mismatch would attach this version's artifacts to a release for a
            # different version.
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag_name '$tag' does not match version '$version' (expected 'v$version')."
              exit 1
            fi
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi

          if [[ ! "$version" =~ $semver_re ]]; then
            echo "::error::Version '$version' is not semantic (expected e.g. 0.2.0 or 1.0.0-beta.1)."
            exit 1
          fi

          # Record whether the tag already exists on the remote. For tag pushes
          # the tag is the triggering ref, so it trivially exists; for dispatch
          # runs this decides both the checkout below and whether the release
          # step pins a fresh tag to the built commit.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if ! remote_tag="$(git ls-remote --tags origin "refs/tags/$tag")"; then
              echo "::error::Could not query origin for tag '$tag'."
              exit 1
            fi
            if [[ -n "$remote_tag" ]]; then
              tag_exists="true"
            else
              tag_exists="false"
            fi
          else
            tag_exists="true"
          fi

          # A dispatch run checks out the dispatched branch, NOT the tag. When
          # the tag already exists we must build ITS source — otherwise
          # artifacts built from (say) current main get attached to the tag and
          # silently rewrite history for a released version. Fail rather than
          # build the wrong code.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "$tag_exists" == "true" ]]; then
            if ! git fetch --depth=1 origin "refs/tags/$tag:refs/tags/$tag"; then
              echo "::error::Tag '$tag' exists on the remote but could not be fetched."
              exit 1
            fi
            if ! git checkout --force "refs/tags/$tag"; then
              echo "::error::Could not check out tag '$tag'."
              exit 1
            fi
            echo "Building from tag $tag ($(git rev-parse HEAD)) instead of the dispatched ref."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$tag_exists" >> "$GITHUB_OUTPUT"
          echo "$version" > VERSION

      - name: Run test suite
        # THE release gate: a tag push must never publish code the suite has not
        # passed. Ordering is the whole point of this step —
        #   • after "Resolve version", because that step may `git checkout` the
        #     tag being released, so this tests the exact source that will be
        #     packaged rather than whatever ref triggered the run;
        #   • before the signing/notary steps, so a red suite means the
        #     Developer ID cert and the notary .p8 are never even decoded onto
        #     the runner's disk.
        # Debug configuration on purpose: it is what the headless suite is
        # written and run against day to day. package_app.sh compiles the
        # shipped binaries separately with `swift build -c release`.
        shell: bash
        # A wedged test process would otherwise burn the job budget above and
        # starve packaging + notarization of the time they need; fail it on its
        # own much shorter clock instead.
        timeout-minutes: 30
        run: |
          swift test

      - name: Import Developer ID signing certificate
        # Only runs when the signing secrets are configured; otherwise the build
        # falls back to an ad-hoc signature (not notarizable, fine for testing).
        # The cert and its password are env-scoped HERE only — no other step
        # (and no child process of the build) ever sees them.
        if: ${{ steps.secrets.outputs.has_cert == 'true' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Random keychain password — NOT ${{ github.run_id }}, which is public
          # in the run URL. Handed to the build step via a 0600 file in
          # RUNNER_TEMP rather than a step output or env: GitHub masks secrets
          # in logs but NOT values derived at runtime, so this must never be
          # echoed or written to $GITHUB_OUTPUT.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          (umask 077; printf '%s' "$KEYCHAIN_PASSWORD" > "$RUNNER_TEMP/keychain_password")
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No auto-lock, so the keychain stays usable for the later build step.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # -T grants ONLY codesign access to the key (no -A, which would let
          # every process on the runner use the signing key).
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # Pre-authorize Apple-signed tools (codesign among them) to use the
          # imported key without a UI prompt — with -A gone, this partition list
          # is what keeps signing non-interactive.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Make our keychain the DEFAULT and put it first on the search list.
          # codesign resolves an identity-by-name against the default keychain, so
          # this is what actually lets the build step find the identity.
          security default-keychain -s "$KEYCHAIN"
          # Keep the existing user keychains on the search list, read line-by-line
          # into an array — keychain paths can contain spaces, so an unquoted
          # $(...) expansion would word-split them.
          existing_keychains=()
          while IFS= read -r line; do
            line="${line//\"/}"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            if [[ -n "$line" && "$line" != "$KEYCHAIN" ]]; then
              existing_keychains+=("$line")
            fi
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KEYCHAIN" "${existing_keychains[@]}"
          rm -f "$RUNNER_TEMP/cert.p12"
          # Fail loudly here (not 60s deep in the build) if the uploaded cert is not a
          # "Developer ID Application" cert — that's the only kind notarization accepts
          # for direct distribution (Apple Distribution / Development certs won't work).
          security find-identity -v -p codesigning
          if ! security find-identity -v -p codesigning | grep -q "Developer ID Application"; then
            echo "::error::MACOS_CERT_P12 does not contain a 'Developer ID Application' certificate." \
                 "Re-export that specific cert from Keychain Access and update the secret." >&2
            exit 1
          fi

      - name: Write notary API key
        if: ${{ steps.secrets.outputs.has_notary == 'true' }}
        # The raw .p8 is env-scoped here only; the build step gets just the
        # PATH to the decoded file.
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        shell: bash
        run: |
          (umask 077; echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary_key.p8")

      - name: Build release artifacts
        shell: bash
        # This step gets only the secrets its scripts actually read:
        #   CODESIGN_IDENTITY   — package_app.sh picks the signing identity.
        #                         Optional: with it unset, package_app.sh resolves
        #                         the Developer ID imported above straight out of
        #                         the keychain, so the keychain work below is
        #                         gated on the cert secret, not on this.
        #   SPARKLE_PRIVATE_KEY — make_release_artifacts.sh EdDSA-signs the zip.
        #   NOTARY_KEY_ID/_ISSUER — notarize_app.sh API-key auth.
        # The .p12 cert + password live only in the import step's keychain, and
        # the raw .p8 only in the write step — `swift build` (repo-controlled
        # Package.swift code) never sees them. NOTARY_KEY_PATH points at the
        # .p8 the previous step wrote (empty when the key secret is unset →
        # notarize_app.sh no-ops).
        env:
          VERSION_OVERRIDE: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
          HAS_CERT: ${{ steps.secrets.outputs.has_cert }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_KEY_ISSUER: ${{ secrets.NOTARY_KEY_ISSUER }}
          NOTARY_KEY_PATH: ${{ steps.secrets.outputs.has_notary == 'true' && format('{0}/notary_key.p8', runner.temp) || '' }}
        run: |
          # Re-unlock the signing keychain in THIS shell — keychain unlock state does
          # not carry across steps, so codesign would otherwise fail with
          # "no identity found" even though the cert is imported. Gated on the same
          # condition as the import step: the cert, not CODESIGN_IDENTITY, is what
          # decides whether a keychain exists to unlock.
          if [[ "$HAS_CERT" == "true" ]]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            # Random password the import step generated (file handoff — see there).
            KEYCHAIN_PASSWORD="$(cat "$RUNNER_TEMP/keychain_password")"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security default-keychain -s "$KEYCHAIN"
            # Same space-safe search-list rebuild as the import step.
            existing_keychains=()
            while IFS= read -r line; do
              line="${line//\"/}"
              line="${line#"${line%%[![:space:]]*}"}"
              line="${line%"${line##*[![:space:]]}"}"
              if [[ -n "$line" && "$line" != "$KEYCHAIN" ]]; then
                existing_keychains+=("$line")
              fi
            done < <(security list-keychains -d user)
            security list-keychains -d user -s "$KEYCHAIN" "${existing_keychains[@]}"
            # Sanity-check the identity is resolvable before the long build.
            security find-identity -v -p codesigning
          fi
          Scripts/make_release_artifacts.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          TAG_EXISTS: ${{ steps.version.outputs.tag_exists }}
          # Only a workflow_dispatch can set this (empty on tag pushes), so a
          # re-pushed tag can never silently replace a published release.
          FORCE_REPUBLISH: ${{ inputs.force_republish }}
        shell: bash
        run: |
          # A version containing a hyphen (e.g. 0.6.2-rc1) is a prerelease. GitHub's
          # /releases/latest excludes prereleases, so the Sparkle "latest" appcast feed
          # never serves an RC to real users — making release-candidate testing safe.
          prerelease_flag=""
          prerelease_value="false"
          if [[ "$VERSION" == *-* ]]; then
            prerelease_flag="--prerelease"
            prerelease_value="true"
          fi
          title="D'Monte's Tool Box $VERSION"
          notes_file="dist/release-notes.md"
          if [[ ! -s "$notes_file" ]]; then
            printf "D'Monte's Tool Box %s release.\n" "$VERSION" > "$notes_file"
          fi

          zip_name="DMonte-Tool-Box-$VERSION.zip"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            # Published releases are immutable. The existing zip is already
            # EdDSA-signed and served to Sparkle clients, and sparkle:version is
            # the run number (which increments per run) — so replacing the asset
            # would push different bytes to users already on this version as a
            # fake "update", with no trace of the old binary. Replacing it must
            # therefore be an explicit, loud act.
            if [[ "$FORCE_REPUBLISH" != "true" ]]; then
              echo "::error::A release for $TAG_NAME is already published; its artifacts are immutable." \
                   "To deliberately republish, run the workflow manually (workflow_dispatch) with" \
                   "version=$VERSION, tag_name=$TAG_NAME and force_republish=true."
              exit 1
            fi

            echo "::warning::FORCE REPUBLISH: replacing already-published artifacts of $TAG_NAME (version $VERSION) in run $GITHUB_RUN_ID, triggered by $GITHUB_ACTOR."
            echo "::warning::Users already on $VERSION will be offered the replacement bytes as a Sparkle update."

            # Preserve the previous binary under a superseded name so it stays
            # auditable — the republish destroys it at the canonical URL. Best
            # effort: a failure here (e.g. the asset is missing) must not brick
            # a deliberate republish.
            superseded_name="DMonte-Tool-Box-$VERSION-superseded-run$GITHUB_RUN_ID.zip"
            preserve_dir="$RUNNER_TEMP/superseded-assets"
            mkdir -p "$preserve_dir"
            if gh release download "$TAG_NAME" --pattern "$zip_name" --dir "$preserve_dir" \
              && mv "$preserve_dir/$zip_name" "$preserve_dir/$superseded_name" \
              && gh release upload "$TAG_NAME" "$preserve_dir/$superseded_name" --clobber; then
              echo "::warning::Previous artifact preserved as release asset $superseded_name."
            else
              echo "::warning::Could not preserve the previous $zip_name (asset may be missing); continuing with the republish."
            fi

            # --prerelease must be set explicitly both ways on edit: the bare
            # flag can only ever SET it, so a stable republish of a former RC
            # tag would otherwise stay stuck as a prerelease forever.
            gh release edit "$TAG_NAME" \
              --title "$title" \
              --notes-file "$notes_file" \
              --prerelease="$prerelease_value"
            gh release delete-asset "$TAG_NAME" "DMonte-Toolbox-$VERSION.zip" -y 2>/dev/null || true
            gh release delete-asset "$TAG_NAME" "$zip_name" -y 2>/dev/null || true
            gh release delete-asset "$TAG_NAME" "appcast.xml" -y 2>/dev/null || true
            gh release upload "$TAG_NAME" \
              "dist/$zip_name" \
              "dist/appcast.xml"
          else
            # When the tag does not exist yet (fresh release via dispatch), pin
            # it to the commit we actually built — otherwise gh would create the
            # tag at whatever the default branch points to at publish time.
            target_args=()
            if [[ "$TAG_EXISTS" != "true" ]]; then
              target_args=(--target "$GITHUB_SHA")
            fi
            gh release create "$TAG_NAME" \
              "dist/$zip_name" \
              "dist/appcast.xml" \
              --title "$title" \
              --notes-file "$notes_file" \
              "${target_args[@]}" \
              $prerelease_flag
          fi

      - name: Clean up signing material
        # Runs on success, failure and cancellation alike, and tolerates the
        # no-secrets path where none of these files were ever created.
        if: always()
        shell: bash
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          if [[ -f "$KEYCHAIN" ]]; then
            # delete-keychain removes the file AND drops it from the search
            # list, which restores the pre-import list (the import step
            # preserved every existing entry).
            security delete-keychain "$KEYCHAIN" || true
            # The import step pointed the default keychain at the signing
            # keychain; point it back at the runner's login keychain.
            LOGIN_KEYCHAIN="$HOME/Library/Keychains/login.keychain-db"
            if [[ -f "$LOGIN_KEYCHAIN" ]]; then
              security default-keychain -s "$LOGIN_KEYCHAIN" || true
            fi
          fi
          rm -f "$RUNNER_TEMP/keychain_password" "$RUNNER_TEMP/notary_key.p8"
