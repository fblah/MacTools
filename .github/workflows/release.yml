name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v"
        required: true
        type: string
      tag_name:
        description: "Existing tag to publish"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            tag="${{ inputs.tag_name }}"
            if [[ -z "$tag" ]]; then
              tag="v$version"
            fi
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$version" > VERSION

      - name: Build release artifacts
        shell: bash
        env:
          VERSION_OVERRIDE: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: Scripts/make_release_artifacts.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG_NAME: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh release create "$TAG_NAME" \
            "dist/DMonte-Toolbox-$VERSION.zip" \
            "dist/appcast.xml" \
            --title "D'Monte's Toolbox $VERSION" \
            --notes "D'Monte's Toolbox $VERSION release."
